  <title>AI Decision Assistant</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;

    .navbar {
      display: flex;

      font-size: 20px;

      cursor: pointer;

    .hero {

      margin-bottom: 20px;
    }

    p {

      font-size: 18px;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 30px;
    }

    .buttons button {
      margin-right: 15px;
    }

    .secondary {
      background: transparent;
      border: 1px solid #64748b;
    }

    .chat-box {
      width: 380px;
      height: 500px;
      background: #020617;
      border-radius: 12px;
      border: 1px solid #1e293b;
      overflow: hidden;
    }

    footer {

    }

</head>
